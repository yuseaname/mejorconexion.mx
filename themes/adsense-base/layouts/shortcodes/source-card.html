{{- /* source-card.html — compact data-provenance trust card (MCX-05b).

    <strong>Datos verificados al {{ .Get "fecha" | default "agosto 2026" }}</strong>

      <a href="/transparencia.html" data-trust-link="transparencia">Transparencia</a> ·
