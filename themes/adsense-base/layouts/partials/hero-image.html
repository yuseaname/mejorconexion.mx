{{- /* hero-image.html — performance-optimized article hero */ -}}
{{ $image := .Params.image }}
{{ if $image }}
  <figure class="hero-figure article-hero">
    <img
      src="{{ $image }}"
      alt="{{ .Params.image_alt | default .Title }}"
      width="1200"
      height="630"
      loading="eager"
      fetchpriority="high"
      decoding="async"
      class="hero-img"
    >
    {{ with .Params.image_caption }}
      <figcaption class="hero-caption">{{ . }}</figcaption>
    {{ end }}
  </figure>
{{ end }}
