baseURL = 'https://mejorconexion.mx/'
languageCode = 'es-mx'
title = 'Mejor Conexión'
theme = 'adsense-base'
disableHugoGeneratorInject = true
disableKinds = ['taxonomy', 'term']
ignoreLogs = ['warning-goldmark-raw-html']

# uglyURLs produces /section/slug.html format (matches original site URLs)
uglyURLs = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  google_analytics = 'G-XFVSHS9J0X'
  site_name = 'Mejor Conexión'
  description = 'Compara proveedores de internet en México. Guías claras, sin jerga, para elegir el mejor servicio para tu hogar.'
  tagline = 'Tu internet, sin complicaciones.'
  author = 'Mejor Conexión'
  favicon = '/assets/images/logo.png'
  og_image = '/assets/images/logo.png'
  google_site_verification = ''
  amazon_tag = 'litwd-20'

  # Trust/legal pages excluded from all ad slots (blueprint S1, mission SQ-014):
  # AdSense policy exposure on thin-content policy pages + trust corrosion.
  ad_free_pages = ['about.md', 'contact.md', 'contacto.md', 'corrections.md', 'editorial-policy.md', 'metodologia.md', 'privacy.md', 'transparencia.md', 'buscar.md']

  [params.adsense]
    client_id = 'ca-pub-5566942094411042'
    [params.adsense.slots]
      below_title = { id = '9770352885', format = 'auto', responsive = 'true' }
      mid_article = { id = '7429084400', format = 'auto', responsive = 'true' }
      end_article = { id = '3364726638', format = 'auto', responsive = 'true' }

  [params.rybbit]
    instance_url = 'https://app.rybbit.io'
    site_id = '095d6520421b'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[permalinks]
  internet-en-casa = '/internet-en-casa/:slug/'
  planes-internet = '/planes-internet/:slug/'
  planes-moviles = '/planes-moviles/:slug/'
  guias = '/guias/:slug/'
  esim = '/esim/:slug/'
  esim-viajeros = '/esim-viajeros/:slug/'
  cobertura = '/cobertura/:slug/'

[outputs]
  home = ["HTML", "SearchIndex"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

