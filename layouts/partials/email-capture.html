{{/* email-capture.html */}}
{{ if eq .Section "blog" }}
<div class="newsletter-box">
  <div class="newsletter-inner">
    <div class="newsletter-icon">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <div>
      <h3 class="newsletter-title">No Pagues de Más por Internet</h3>
      <p class="newsletter-text">Recibe consejos claros para elegir el mejor internet y pagar menos. Un correo al mes. Sin spam.</p>
    </div>
  </div>
  <form class="newsletter-form" action="#" method="POST">
    <input type="email" name="EMAIL" placeholder="tu@correo.com" class="newsletter-input" required aria-label="Correo electrónico">
    <button type="submit" class="newsletter-btn">Recibir Consejos</button>
  </form>
</div>
{{ end }}
