name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.141.0'
          extended: true
      - name: Build clean Hugo artifact
        run: |
          rm -rf public/
          hugo --minify --gc
      - name: Verify generated artifact
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/ads.txt
          test -f public/planes-moviles/telcel-vs-att-vs-movistar.html
          grep -q 'ca-pub-5566942094411042' public/index.html
          grep -q '095d6520421b' public/index.html
      - name: Content-defect ratchet (mission SQ-014 S1)
        # Ratchets: counts must never EXCEED baseline. Cleanup sprints lower the
        # numbers; regression fails the deploy. FAQPage floor catches the R8
        # shortcode/Store race dropping schema wholesale (seen: 96 vs 215 builds).
        run: |
          TRIPLE_COLON=$(grep -rl ':::' public --include='*.html' | wc -l)
          PANDOC_ATTR=$(grep -rl '{\.card}\|{\.label}\|{\.btn}' public --include='*.html' | wc -l)
          FAQPAGES=$(grep -rl 'FAQPage' public --include='*.html' | wc -l)
          echo "::: leak pages: $TRIPLE_COLON (ratchet <= 179)"
          echo "{.attr} leak pages: $PANDOC_ATTR (ratchet <= 32)"
          echo "FAQPage pages: $FAQPAGES (floor >= 200)"
          test "$TRIPLE_COLON" -le 179
          test "$PANDOC_ATTR" -le 32
          test "$FAQPAGES" -ge 200
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H -p 65002 "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002" \
            ./public/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:~/domains/mejorconexion.mx/public_html/"
